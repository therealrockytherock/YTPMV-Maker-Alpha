<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>YTPMV Studio</title>
<style>

button.g{background:var(--key);color:var(--fg);box-shadow:none}button.g:hover{background:var(--key2)}

input[type=file]{display:none}
.seg{display:flex;border-radius:10px;overflow:hidden;background:var(--key)}.seg button{border-radius:0;box-shadow:none;padding:6px 12px}.seg button.g{background:transparent}.seg button.g.on{background:linear-gradient(135deg,var(--ac),var(--ac2))}.seg button:hover{transform:none}

.sub{color:var(--mut);margin:0 0 22px;letter-spacing:.2em;text-transform:uppercase;font-size:12px;opacity:0;animation:li .8s .9s forwards}

[hidden]{display:none!important}

.ws{position:relative;height:660px;display:grid;grid-template-columns:140px minmax(0,1fr);gap:10px;padding:10px;overflow:hidden}

.vsec{margin:14px 0 4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ac);font-weight:700}

</style></head><body><div id="sp" class="sp"><div class="ring"></div><div class="ring r2"></div><div class="sl"><h1 id="spt"></h1><div class="eq" id="eq"></div><p class="sub">Turn any clip into a music video</p><button id="go">▶ Click to start</button></div></div><main>

<button class="sw" data-a="#d946ef" data-b="#f7f0ff" style="background:linear-gradient(135deg,#d946ef,#f7f0ff)" title="Orchid"></button></div></div></div>

<div class="card" style="padding:0;overflow:hidden">
<div class="row tabrow"><div class="seg" id="tabs"><button class="g on" data-tab="pl">Playlist</button><button class="g" data-tab="vp">Video preview</button></div>

<div id="tab-pl" class="ws">

<div class="plmain"><div class="row plh"><b>Playlist — Arrangement</b><span class="hint" style="margin:0">Pick a pattern, click a cell to place it, click a clip to remove it.</span><label>Bars <select id="pb"><option>8</option><option selected>16</option><option>32</option></select></label></div>
<div class="sc"><div class="rel"><canvas id="pl"></canvas><div class="ph" id="ph2"></div></div></div></div>

<div id="tab-vp" class="vgrid" hidden><div class="stage"><canvas id="cv" width="640" height="360"></canvas>
<div class="row" style="margin-top:12px"><button id="vplay">▶ Play</button><button class="g" id="vstop">■</button><span id="tm">0:00</span><div class="pbar"><i id="pg"></i></div></div></div>

</div>
<div id="status"></div></main>
<script>
const $=id=>document.getElementById(id),NN=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],nm=p=>NN[p%12]+(Math.floor(p/12)-1),esc=s=>s.replace(/[&<>"]/g,m=>'&#'+m.charCodeAt(0)+';');

 dlyIn=ctx.createGain();dly=ctx.createDelay(2);dly.delayTime.value=.32;fb=ctx.createGain();fb.gain.value=+$('fbk').value;dlyIn.connect(dly);dly.connect(fb);fb.connect(dly);dly.connect(master);

 src.connect(e);e.connect(c.n.in);if(c.loop){src.loop=true;src.loopStart=a;src.loopEnd=b;src.start(t,a)}else src.start(t,a,b-a);
 src.stop(end+.02);srcs.push(src);src.onended=()=>{const i=srcs.indexOf(src);if(i>=0)srcs.splice(i,1)}}
